name: CI

# The suites are the only thing standing between a refactor and somebody's
# deleted conversation, and until now nothing ran them automatically: every
# audit in this repository was a manual `npm test` on the author's machine.
#
# The package has no runtime or dev dependencies, so there is no install step —
# checkout and run.
#
# The matrix is deliberately wide. Windows is not a formality: path handling,
# `EBUSY`-tolerant cleanup and the `.zstd` session log layout all have platform
# branches that a Linux-only run never exercises, and the fixtures are shaped
# like a Windows DSH home. Node 22.15 is the floor `package.json#engines`
# promises.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.15', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # A failing step's raw log needs repository credentials to read, so a red
      # build used to report nothing but "exit code 1" — not enough to tell a
      # locale-dependent assertion from a missing fixture. This helper turns the
      # captured output into a workflow annotation, which is readable without
      # credentials. It lives in RUNNER_TEMP on purpose: it is CI plumbing, not
      # part of the published package.
      - name: annotation helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/annotate.js" <<'JS'
          const fs = require('node:fs')

          const [logPath, stepName, platform, nodeVersion] = process.argv.slice(2)
          let text
          try {
            text = fs.readFileSync(logPath, 'utf8')
          } catch (error) {
            console.log(`::error file=.github/workflows/ci.yml,title=${stepName}: ${platform} node ${nodeVersion}::could not read ${logPath}: ${error.message}`)
            process.exit(0)
          }

          const lines = text.split(/\r?\n/)
          // Every place that says "something failed": the per-test TAP line, the
          // per-file runner verdict, and the summary counter. Keep the ~50 lines
          // before each, which is where the expectation/stack lives.
          const marks = []
          lines.forEach((line, index) => {
            if (/^\s*(not ok |✖ )/.test(line) || /(ℹ|#) fail [1-9]/.test(line) || /^\s*failed:/.test(line)) marks.push(index)
          })

          const keep = new Set()
          const anchors = marks.length > 0 ? marks : [lines.length - 1]
          for (const index of anchors) {
            for (let i = Math.max(0, index - 50); i <= Math.min(lines.length - 1, index + 2); i += 1) keep.add(i)
          }
          const detail = [...keep].sort((a, b) => a - b).map((i) => lines[i]).join('\n')
          const cut = detail.length > 12000 ? `${detail.slice(0, 12000)}\n…(truncated)` : detail
          const escape = (value) => value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')
          console.log(`::error file=.github/workflows/ci.yml,title=${stepName} failed: ${platform} node ${nodeVersion}::${escape(cut)}`)
          JS

      # Syntax of every shipped file + the manifest/config contract.
      - name: check (syntax + manifest)
        shell: bash
        run: |
          set +e
          npm run check > check.log 2>&1
          status=$?
          cat check.log
          if [ "$status" -ne 0 ]; then
            node "$RUNNER_TEMP/annotate.js" check.log check "$RUNNER_OS" "$(node --version)"
          fi
          exit "$status"

      # Every suite; the runner keeps going after a failing file so one red
      # suite never hides the state of the other nine.
      - name: test
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            node "$RUNNER_TEMP/annotate.js" test.log test "$RUNNER_OS" "$(node --version)"
          fi
          exit "$status"

      # A packaged artifact must never carry `test/.tmp` fixtures. Two layers are
      # checked separately so neither can hide the other's failure:
      #   1. `files: ["test/*.mjs"]` must exclude the directory on its own, so
      #      the probe below is created and packed with `--ignore-scripts`
      #      (i.e. without `prepack` cleaning it up first);
      #   2. `prepack` must then remove the leftovers.
      - name: pack (no fixtures in the tarball)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test/.tmp/probe
          echo x > test/.tmp/probe/session.jsonl
          echo x > test/.tmp/probe.lock
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('pack.json', 'utf8');
            const manifest = JSON.parse(raw.slice(raw.indexOf('[{')))[0];
            const leaked = manifest.files.map((f) => f.path).filter((p) => p.startsWith('test/.tmp'));
            if (leaked.length > 0) {
              console.error('::error file=.github/workflows/ci.yml,title=packed fixtures::' + leaked.join(' '));
              process.exit(1);
            }
            console.log('tarball ok:', manifest.entryCount, 'files, no test/.tmp');
          "
          npm run prepack
          test ! -e test/.tmp/probe
